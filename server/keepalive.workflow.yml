# Шаблон пинга, если сервер комнат выложен на бесплатный хостинг (Render/Fly):
# инстанс засыпает через ~15 минут без запросов, первый запрос идёт 30-50 секунд.
# Скопируй в .github/workflows/keepalive.yml и подставь свой адрес.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -m 60 -fsS https://YOUR-SERVER.onrender.com/health && break
            sleep 20
          done
