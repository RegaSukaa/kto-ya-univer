name: android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -6
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -4
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/screenshots/*.png
          if-no-files-found: warn

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i
      - run: npm test
